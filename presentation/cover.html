<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
    <style>
      .slide-container {
        width: 1280px;
        min-height: 720px;
        background: linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #42a5f5 100%);
        color: #ffffff;
        font-family: 'Arial', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px;
      }
      .title {
        font-size: 56px;
        font-weight: bold;
        margin-bottom: 30px;
        text-align: center;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }
      .subtitle {
        font-size: 32px;
        margin-bottom: 60px;
        text-align: center;
      }
      .logo-container {
        margin-top: 40px;
      }
      .logo {
        max-width: 600px;
        max-height: 300px;
      }
    </style>
  </head>
  <body>
    <div class="slide-container">
      <h1 class="title">AI Agent驱动的动态攻防推演靶场平台</h1>
      <h2 class="subtitle">基于生成式AI、大数据分析的新一代网络安全人才培养解决方案</h2>
      
      <div class="logo-container">
        <img src="/home/ubuntu/ppt_assets/cyber_exercise.png" alt="网络攻防演练" class="logo">
      </div>
      
      <div class="mt-auto text-right w-full">
        <p class="text-xl">2025年1月</p>
      </div>
    </div>
  </body>
</html>
