<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 网络安全攻防训练平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/user-management.css') }}">
    <style>
        body {
            padding: 0;
            margin: 0;
            background-color: transparent;
        }
        .main-content {
            padding: 0;
            margin: 0;
            width: 100%;
        }
        .page-header {
            margin-top: 0;
            padding-top: 16px;
        }
    </style>
</head>
<body>
    <!-- 主内容区域 -->
    <main class="main-content">

        <!-- 用户管理工具栏 -->
        <div class="user-management-toolbar">
            <div class="toolbar-left">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="搜索用户..." id="userSearchInput">
                </div>
                <div class="filter-dropdown">
                    <select id="userRoleFilter">
                        <option value="all">所有角色</option>
                        <option value="admin">管理员</option>
                        <option value="teacher">教师</option>
                        <option value="student">学生</option>
                    </select>
                </div>
                <div class="filter-dropdown">
                    <select id="userStatusFilter">
                        <option value="all">所有状态</option>
                        <option value="active">活跃</option>
                        <option value="inactive">非活跃</option>
                    </select>
                </div>
            </div>
            <div class="toolbar-right">
                <button class="btn-primary" onclick="showAddUserModal()">
                    <i class="fas fa-plus"></i>
                    添加用户
                </button>
                <button class="btn-secondary" onclick="exportUsers()">
                    <i class="fas fa-download"></i>
                    导出
                </button>
            </div>
        </div>

        <!-- 用户列表表格 -->
        <div class="user-table-container">
            <table class="user-table">
                <thead>
                    <tr>
                        <th>
                            <input type="checkbox" id="selectAllUsers">
                        </th>
                        <th>用户信息</th>
                        <th>部门</th>
                        <th>角色</th>
                        <th>状态</th>
                        <th>注册时间</th>
                        <th>最后登录</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- JS 动态渲染 -->
                </tbody>
            </table>
        </div>

        <!-- 分页控件 -->
        <div class="pagination-container">
            <div class="pagination-info"><span></span></div>
            <div class="pagination-controls" id="paginationControls"></div>
        </div>
    </main>

    <!-- 添加用户模态框 -->
    <div id="addUserModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>添加新用户</h2>
                <button class="modal-close" onclick="closeAddUserModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="addUserForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="userName">用户名 *</label>
                            <input type="text" id="userName" name="userName" required>
                        </div>
                        <div class="form-group">
                            <label for="userEmail">邮箱 *</label>
                            <input type="email" id="userEmail" name="userEmail" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="userRole">角色 *</label>
                            <select id="userRole" name="userRole" required>
                                <option value="">请选择角色</option>
                                <option value="admin">管理员</option>
                                <option value="teacher">教师</option>
                                <option value="student">学生</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="userPhone">手机号</label>
                            <input type="tel" id="userPhone" name="userPhone">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="userPassword">密码 *</label>
                            <input type="password" id="userPassword" name="userPassword" required>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">确认密码 *</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="userDepartment">部门/班级</label>
                        <input type="text" id="userDepartment" name="userDepartment">
                    </div>
                    <div class="form-group">
                        <label for="userDescription">备注</label>
                        <textarea id="userDescription" name="userDescription" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeAddUserModal()">取消</button>
                <button type="submit" class="btn-primary" onclick="submitAddUser()">添加用户</button>
            </div>
        </div>
    </div>

    <!-- 编辑用户模态框 -->
    <div id="editUserModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>编辑用户</h2>
                <button class="modal-close" onclick="closeEditUserModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="editUserForm">
                    <input type="hidden" id="editUserId">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editUserName">用户名</label>
                            <input type="text" id="editUserName" disabled>
                        </div>
                        <div class="form-group">
                            <label for="editUserEmail">邮箱</label>
                            <input type="email" id="editUserEmail" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editRealName">姓名</label>
                            <input type="text" id="editRealName">
                        </div>
                        <div class="form-group">
                            <label for="editUserPhone">手机号</label>
                            <input type="tel" id="editUserPhone">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editUserRole">角色</label>
                            <select id="editUserRole">
                                <option value="admin">管理员</option>
                                <option value="teacher">教师</option>
                                <option value="student">学生</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="editUserStatus">状态</label>
                            <select id="editUserStatus">
                                <option value="active">活跃</option>
                                <option value="inactive">非活跃</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeEditUserModal()">取消</button>
                <button type="submit" class="btn-primary" onclick="saveEditUser()">保存</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='components/sidebar.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/user-management.js') }}"></script>
</body>
</html>
