<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学员登录 - AI靶场系统</title>
    <link rel="preconnect" href="https://fonts.font.im">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.font.im/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/ui-components.css') }}">
</head>
<body class="student-login">
    <div class="container">
        <div class="login-container">
            <div class="login-header">
                <div class="icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z" fill="currentColor"/>
                    </svg>
                </div>
                <h2>学员登录</h2>
                <p>开始您的AI安全学习之旅</p>
            </div>
            
            <form id="studentLoginForm" onsubmit="handleStudentLogin(event)">
                <div class="form-group">
                    <label for="studentUsername">学员账号</label>
                    <input type="text" id="studentUsername" name="username" placeholder="请输入学员账号或邮箱" required>
                </div>
                
                <div class="form-group">
                    <label for="studentPassword">密码</label>
                    <input type="password" id="studentPassword" name="password" placeholder="请输入密码" required>
                </div>
                
                <div class="form-group">
                    <label for="studentCode">验证码</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="studentCode" name="code" placeholder="请输入验证码" required style="flex: 1;">
                        <canvas id="studentCaptcha" width="120" height="40" style="border: 1px solid #ddd; border-radius: 5px; cursor: pointer;" onclick="generateStudentCaptcha()"></canvas>
                    </div>
                </div>
                
                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>记住我</span>
                    </label>
                    <a href="#" class="forgot-password">忘记密码？</a>
                </div>
                
                <button type="submit" class="login-submit">开始学习</button>
                
                <div style="text-align: center; margin-top: 20px;">
                    <p style="color: #666; font-size: 0.9rem;">还没有账号？ <a href="student-register.html" style="color: #4834d4; text-decoration: none;">立即注册</a></p>
                </div>
            </form>
            
            <div class="back-home">
                <a href="{{ url_for('index') }}">← 返回首页</a>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='scripts/ui-utils.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/student-login.js') }}"></script>
</body>
</html>
