<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>防御决策库</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/defense-library.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-shield"></i> 防御决策库</h1>
            <p>管理和浏览所有防御策略和技术</p>
        </header>

        <div class="toolbar">
            <div class="search-bar">
                <input type="text" placeholder="搜索防御策略...">
                <button><i class="fas fa-search"></i></button>
            </div>
            <button class="add-btn"><i class="fas fa-plus"></i> 添加新策略</button>
        </div>

        <div class="defense-table-container">
            <table class="defense-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>名称</th>
                        <th>描述</th>
                        <th>类别</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be loaded dynamically -->
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <a href="#" class="active">1</a>
            <a href="#">2</a>
            <a href="#">3</a>
            <span>...</span>
            <a href="#">8</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/defenses')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.querySelector('.defense-table tbody');
                    tbody.innerHTML = ''; // Clear existing data
                    data.forEach(defense => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${defense.id}</td>
                            <td>${defense.name}</td>
                            <td>${defense.description}</td>
                            <td>${defense.category}</td>
                            <td class="actions">
                                <button class="edit-btn"><i class="fas fa-edit"></i></button>
                                <button class="delete-btn"><i class="fas fa-trash"></i></button>
                            </td>
                        `;
                        tbody.appendChild(row);
                    });
                });
        });
    </script>
</body>
</html>
