<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具库</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/tool-library.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-toolbox"></i> 工具库</h1>
            <p>管理和浏览所有安全工具</p>
        </header>

        <div class="toolbar">
            <div class="search-bar">
                <input type="text" placeholder="搜索工具...">
                <button><i class="fas fa-search"></i></button>
            </div>
            <button class="add-btn"><i class="fas fa-plus"></i> 添加新工具</button>
        </div>

        <div class="tool-grid">
            <!-- 示例工具 -->
            <div class="tool-card">
                <div class="tool-icon"><i class="fas fa-network-wired"></i></div>
                <h3>Nmap</h3>
                <p>网络发现和安全审计工具</p>
                <div class="tags">
                    <span>扫描</span>
                    <span>端口</span>
                </div>
                <div class="actions">
                    <button class="edit-btn"><i class="fas fa-edit"></i></button>
                    <button class="delete-btn"><i class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="tool-card">
                <div class="tool-icon"><i class="fas fa-shield-alt"></i></div>
                <h3>Wireshark</h3>
                <p>网络协议分析器</p>
                <div class="tags">
                    <span>抓包</span>
                    <span>分析</span>
                </div>
                <div class="actions">
                    <button class="edit-btn"><i class="fas fa-edit"></i></button>
                    <button class="delete-btn"><i class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="tool-card">
                <div class="tool-icon"><i class="fas fa-bug"></i></div>
                <h3>Metasploit</h3>
                <p>渗透测试框架</p>
                <div class="tags">
                    <span>漏洞利用</span>
                    <span>渗透</span>
                </div>
                <div class="actions">
                    <button class="edit-btn"><i class="fas fa-edit"></i></button>
                    <button class="delete-btn"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        </div>

        <div class="pagination">
            <a href="#" class="active">1</a>
            <a href="#">2</a>
            <a href="#">3</a>
        </div>
    </div>
</body>
</html>
